name: transport-delegation-outbox-validation-only

on:
  workflow_dispatch:
  push:
    paths:
      - outbox/ecosystem-delegation/**
      - scripts/transport_delegation_outbox.py
      - api/tests/test_delegation_transport.py
      - .github/workflows/transport-delegation-outbox.yml

permissions:
  contents: read

jobs:
  validate_transport_boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Test fail-closed TVC transport boundary
        run: python -m pytest -q api/tests/test_delegation_transport.py
      - name: Emit non-secret blocked transport observation
        run: |
          rm -f state/delegation_transport.json
          python scripts/transport_delegation_outbox.py
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path("state/delegation_transport.json").read_text())
          assert state["status"] == "TVC_ADMITTED_TRANSPORT_REQUIRED"
          assert state["credential_material_present"] is False
          assert state["transport_performed"] is False
          assert state["authority_effect"] == "NONE"
          PY
      - name: Upload non-secret transport observation
        uses: actions/upload-artifact@v4
        with:
          name: hcb-delegation-transport-boundary
          path: state/delegation_transport.json
          if-no-files-found: error
          retention-days: 30

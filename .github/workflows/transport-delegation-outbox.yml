name: transport-delegation-outbox

on:
  workflow_dispatch:
  schedule:
    - cron: "31 * * * *"
  push:
    paths:
      - outbox/ecosystem-delegation/**
      - scripts/transport_delegation_outbox.py
      - api/tests/test_delegation_transport.py
      - .github/workflows/transport-delegation-outbox.yml

permissions:
  contents: write

concurrency:
  group: transport-delegation-outbox
  cancel-in-progress: false

jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STEGVERSE_TRANSPORT_TOKEN: ${{ secrets.STEGVERSE_TRANSPORT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Test token-gated transport
        run: |
          cd api
          python -m pytest -q tests/test_delegation_transport.py
      - name: Transport governed candidates when authority exists
        run: python scripts/transport_delegation_outbox.py
      - name: Commit transport state
        run: |
          if git diff --quiet -- state/delegation_transport.json; then
            echo "Delegation transport state unchanged."
            exit 0
          fi
          git config user.name "StegVerse Bot"
          git config user.email "stegverse-bot@users.noreply.github.com"
          git add state/delegation_transport.json
          git commit -m "Record governed delegation transport state"
          git pull --rebase origin main
          git push origin HEAD:main

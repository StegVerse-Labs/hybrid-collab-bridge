name: StegVerse Connectivity Entity (Hybrid-Collab-Bridge)

on:
  workflow_dispatch:
    inputs:
      instructions:
        description: "Task for the Hybrid-Collab-Bridge AI entity"
        required: true
        default: "Audit and improve connectivity based on stegverse_connectivity.md."

permissions:
  contents: read

jobs:
  connectivity_entity_source_validation:
    runs-on: ubuntu-latest
    env:
      INSTRUCTIONS: ${{ github.event.inputs.instructions }}
      REPO: ${{ github.repository }}
      SYSTEM_PROMPT: "You are StegVerse-AI-Connectivity. Perform tasks reliably."
      USER_PROMPT: ${{ github.event.inputs.instructions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Run non-authorizing local compatibility validation
        run: python .github/ai_entity_runner.py
      - name: Assert hosted authority boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("brain_reports/connectivity_entity_result.json").read_text())
          observation = {
              "schema": "stegverse.hcb.hosted-connectivity-validation/v1",
              "state": "SOURCE_VALIDATED_RUNTIME_NOT_AUTHORIZED",
              "github_actions_role": "VALIDATION_TRANSPORT_ONLY",
              "credential_authority": "TV/TVC",
              "credential_bearing_execution_performed": False,
              "repository_mutation_performed": False,
              "provider_execution_authority_effect": "NONE",
              "report_status": report.get("status"),
          }
          Path("brain_reports/hosted-authority-observation.json").write_text(
              json.dumps(observation, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload non-secret validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: hcb-connectivity-source-validation
          path: brain_reports/
          if-no-files-found: error
          retention-days: 30

name: Human-LLM Interoperability

on:
  push:
    paths:
      - "api/app/**"
      - "schemas/**"
      - "examples/**"
      - "evidence/hil-independent-responses/*.json"
      - "evidence/hil/*.json"
      - "tools/**"
      - "tests/**"
      - "Dockerfile.style-api"
      - "requirements-style-api.txt"
      - "render.yaml"
      - ".github/workflows/human-llm-interoperability.yml"
  pull_request:
    paths:
      - "api/app/**"
      - "schemas/**"
      - "examples/**"
      - "evidence/hil-independent-responses/*.json"
      - "evidence/hil/*.json"
      - "tools/**"
      - "tests/**"
      - "Dockerfile.style-api"
      - "requirements-style-api.txt"
      - "render.yaml"
      - ".github/workflows/human-llm-interoperability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      HCB_RECEIPT_SIGNING_KEY: ci-only-human-llm-receipt-signing-key
      HCB_RECEIPT_SIGNER_ID: ci-human-llm-assessor
      HCB_RECEIPT_SIGNING_KEY_REF: ci:ephemeral:human-llm-receipts
      HCB_STYLE_RECEIPT_KEY: ci-only-style-generation-key
      HCB_STYLE_RECEIPT_SIGNER_ID: ci-style-generation-recorder
      HCB_STYLE_RECEIPT_KEY_REF: ci:ephemeral:style-generation-receipts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest fastapi pydantic httpx pyyaml jsonschema
      - name: Validate example records
        run: python tools/validate_human_llm_pair_assessments.py examples/human_llm_pair_assessments.jsonl
      - name: Validate canonical HIL independent response
        run: python tools/validate_hil_independent_response.py evidence/hil-independent-responses/HIL-RESP-GPT56-20260726-001.json
      - name: Validate bounded style-attribution observation
        run: python tools/validate_style_attribution_observations.py examples/style_attribution_observation.valid.json
      - name: Evaluate governed style-attribution corpus
        run: python tools/evaluate_style_attribution_corpus.py examples/style_attribution_corpus.jsonl --output /tmp/style-attribution-report.json
      - name: Confirm overreach fixture is rejected
        run: |
          if python tools/validate_style_attribution_observations.py examples/style_attribution_observation.invalid-overreach.json; then
            echo "invalid overreach fixture unexpectedly passed"
            exit 1
          fi
      - name: Exercise style generation receipt builder and validator
        run: |
          printf 'Explain individual significance.\n' > /tmp/style-prompt.txt
          printf 'Significance begins when an entity assigns value.\n' > /tmp/style-output.txt
          python tools/build_style_generation_receipt.py \
            --sample-id CI-SAMPLE-001 \
            --provider controlled-ci \
            --model-family controlled-fixture \
            --model-version v1 \
            --prompt /tmp/style-prompt.txt \
            --output /tmp/style-output.txt \
            --platform-context github-actions \
            --out /tmp/style-generation-receipt.json
          python tools/validate_style_generation_receipts.py /tmp/style-generation-receipt.json
      - name: Build style API container
        run: docker build -f Dockerfile.style-api -t stegverse-hil-style-api:ci .
      - name: Build and verify authenticated mediated transition receipts
        run: python tools/build_mediated_transition_receipts.py examples/human_llm_pair_assessments.jsonl /tmp/mediated-transition-receipts.jsonl
      - name: Run interoperability test suite
        run: python -m pytest -q tests/test_application_startup.py tests/test_governance_snapshot.py tests/test_hil_independent_response.py tests/test_human_llm_pair_assessments.py tests/test_human_llm_evidence.py tests/test_human_llm_interoperability_runtime.py tests/test_human_llm_replay.py tests/test_human_llm_run_hook.py tests/test_mediated_transition_receipts.py tests/test_receipt_signing.py tests/test_style_attribution_observations.py tests/test_style_attribution_corpus.py tests/test_style_generation_receipts.py tests/test_controlled_style_experiment.py tests/test_style_accommodation.py tests/test_classification_degradation.py tests/test_style_experiment_api.py tests/test_style_api_deployment.py tests/test_style_experiment_intake.py tests/test_init_style_experiment_packet.py tests/test_verify_style_experiment_packet.py tests/test_style_experiment_execution_plan.py tests/test_style_experiment_activation_chain.py tests/test_governed_api_entrypoint.py

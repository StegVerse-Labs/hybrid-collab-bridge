name: Human-LLM Interoperability

on:
  push:
    paths:
      - "api/app/__init__.py"
      - "api/app/governance/__init__.py"
      - "api/app/governance/dashboard.py"
      - "api/app/governance/human_llm_evidence.py"
      - "api/app/governance/human_llm_interoperability.py"
      - "api/app/governance/human_llm_replay.py"
      - "api/app/governance/human_llm_run_hook.py"
      - "api/app/governance/receipt_signing.py"
      - "schemas/human_llm_pair_assessment.schema.json"
      - "examples/human_llm_pair_assessments.jsonl"
      - "tools/validate_human_llm_pair_assessments.py"
      - "tools/build_mediated_transition_receipts.py"
      - "tests/test_human_llm_pair_assessments.py"
      - "tests/test_human_llm_evidence.py"
      - "tests/test_human_llm_interoperability_runtime.py"
      - "tests/test_human_llm_replay.py"
      - "tests/test_human_llm_run_hook.py"
      - "tests/test_mediated_transition_receipts.py"
      - "tests/test_receipt_signing.py"
      - ".github/workflows/human-llm-interoperability.yml"
  pull_request:
    paths:
      - "api/app/__init__.py"
      - "api/app/governance/__init__.py"
      - "api/app/governance/dashboard.py"
      - "api/app/governance/human_llm_evidence.py"
      - "api/app/governance/human_llm_interoperability.py"
      - "api/app/governance/human_llm_replay.py"
      - "api/app/governance/human_llm_run_hook.py"
      - "api/app/governance/receipt_signing.py"
      - "schemas/human_llm_pair_assessment.schema.json"
      - "examples/human_llm_pair_assessments.jsonl"
      - "tools/validate_human_llm_pair_assessments.py"
      - "tools/build_mediated_transition_receipts.py"
      - "tests/test_human_llm_pair_assessments.py"
      - "tests/test_human_llm_evidence.py"
      - "tests/test_human_llm_interoperability_runtime.py"
      - "tests/test_human_llm_replay.py"
      - "tests/test_human_llm_run_hook.py"
      - "tests/test_mediated_transition_receipts.py"
      - "tests/test_receipt_signing.py"
      - ".github/workflows/human-llm-interoperability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      HCB_RECEIPT_SIGNING_KEY: ci-only-human-llm-receipt-signing-key
      HCB_RECEIPT_SIGNER_ID: ci-human-llm-assessor
      HCB_RECEIPT_SIGNING_KEY_REF: ci:ephemeral:human-llm-receipts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest fastapi pydantic httpx pyyaml jsonschema
      - name: Validate example records
        run: python tools/validate_human_llm_pair_assessments.py examples/human_llm_pair_assessments.jsonl
      - name: Build and verify authenticated mediated transition receipts
        run: python tools/build_mediated_transition_receipts.py examples/human_llm_pair_assessments.jsonl /tmp/mediated-transition-receipts.jsonl
      - name: Run assessment, evidence, authentication, and replay tests
        run: python -m pytest -q tests/test_human_llm_pair_assessments.py tests/test_human_llm_evidence.py tests/test_human_llm_interoperability_runtime.py tests/test_human_llm_replay.py tests/test_human_llm_run_hook.py tests/test_mediated_transition_receipts.py tests/test_receipt_signing.py

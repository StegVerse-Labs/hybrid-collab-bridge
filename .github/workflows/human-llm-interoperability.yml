name: Human-LLM Interoperability

on:
  push:
    paths:
      - "api/app/__init__.py"
      - "api/app/main.py"
      - "api/app/governance/__init__.py"
      - "api/app/governance/admission.py"
      - "api/app/governance/cge_client.py"
      - "api/app/governance/dashboard.py"
      - "api/app/governance/governance_snapshot.py"
      - "api/app/governance/human_llm_evidence.py"
      - "api/app/governance/human_llm_interoperability.py"
      - "api/app/governance/human_llm_replay.py"
      - "api/app/governance/human_llm_run_hook.py"
      - "api/app/governance/receipt_signing.py"
      - "schemas/human_llm_pair_assessment.schema.json"
      - "schemas/hil_independent_response.schema.json"
      - "schemas/style_attribution_observation.schema.json"
      - "examples/human_llm_pair_assessments.jsonl"
      - "examples/hil-independent-response.*.json"
      - "examples/style_attribution_observation.*.json"
      - "examples/style_attribution_corpus.jsonl"
      - "evidence/hil-independent-responses/*.json"
      - "evidence/hil/*.json"
      - "tools/validate_human_llm_pair_assessments.py"
      - "tools/validate_hil_independent_response.py"
      - "tools/validate_style_attribution_observations.py"
      - "tools/evaluate_style_attribution_corpus.py"
      - "tools/build_mediated_transition_receipts.py"
      - "tests/test_application_startup.py"
      - "tests/test_governance_snapshot.py"
      - "tests/test_hil_independent_response.py"
      - "tests/test_human_llm_pair_assessments.py"
      - "tests/test_human_llm_evidence.py"
      - "tests/test_human_llm_interoperability_runtime.py"
      - "tests/test_human_llm_replay.py"
      - "tests/test_human_llm_run_hook.py"
      - "tests/test_mediated_transition_receipts.py"
      - "tests/test_receipt_signing.py"
      - "tests/test_style_attribution_observations.py"
      - "tests/test_style_attribution_corpus.py"
      - ".github/workflows/human-llm-interoperability.yml"
  pull_request:
    paths:
      - "api/app/**"
      - "schemas/**"
      - "examples/**"
      - "evidence/hil-independent-responses/*.json"
      - "evidence/hil/*.json"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/human-llm-interoperability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      HCB_RECEIPT_SIGNING_KEY: ci-only-human-llm-receipt-signing-key
      HCB_RECEIPT_SIGNER_ID: ci-human-llm-assessor
      HCB_RECEIPT_SIGNING_KEY_REF: ci:ephemeral:human-llm-receipts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest fastapi pydantic httpx pyyaml jsonschema
      - name: Validate example records
        run: python tools/validate_human_llm_pair_assessments.py examples/human_llm_pair_assessments.jsonl
      - name: Validate canonical HIL independent response
        run: python tools/validate_hil_independent_response.py evidence/hil-independent-responses/HIL-RESP-GPT56-20260726-001.json
      - name: Validate bounded style-attribution observation
        run: python tools/validate_style_attribution_observations.py examples/style_attribution_observation.valid.json
      - name: Evaluate governed style-attribution corpus
        run: python tools/evaluate_style_attribution_corpus.py examples/style_attribution_corpus.jsonl --output /tmp/style-attribution-report.json
      - name: Confirm overreach fixture is rejected
        run: |
          if python tools/validate_style_attribution_observations.py examples/style_attribution_observation.invalid-overreach.json; then
            echo "invalid overreach fixture unexpectedly passed"
            exit 1
          fi
      - name: Build and verify authenticated mediated transition receipts
        run: python tools/build_mediated_transition_receipts.py examples/human_llm_pair_assessments.jsonl /tmp/mediated-transition-receipts.jsonl
      - name: Run interoperability test suite
        run: python -m pytest -q tests/test_application_startup.py tests/test_governance_snapshot.py tests/test_hil_independent_response.py tests/test_human_llm_pair_assessments.py tests/test_human_llm_evidence.py tests/test_human_llm_interoperability_runtime.py tests/test_human_llm_replay.py tests/test_human_llm_run_hook.py tests/test_mediated_transition_receipts.py tests/test_receipt_signing.py tests/test_style_attribution_observations.py tests/test_style_attribution_corpus.py

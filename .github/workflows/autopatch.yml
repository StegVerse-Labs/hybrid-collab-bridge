name: autopatch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autopatch:
    runs-on: ubuntu-latest

    env:
      PAT_WORKFLOW: ${{ secrets.PAT_WORKFLOW }}
      GH_STEGVERSE_PAT: ${{ secrets.GH_STEGVERSE_PAT }}
      GITHUB_TOKEN: ${{ github.token }}
      STEG_TOKEN: ${{ secrets.STEG_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install autopatch deps
        shell: bash
        run: |
          set -euo pipefail

          if [ -f scripts/requirements-yaml.txt ]; then
            pip install -r scripts/requirements-yaml.txt
          else
            pip install PyYAML
          fi

      - name: Fix ledger event paths self-heal
        shell: bash
        run: |
          set -euo pipefail

          if [ -f scripts/fix_ledger_event_paths.py ]; then
            python scripts/fix_ledger_event_paths.py
          else
            echo "scripts/fix_ledger_event_paths.py not present; autopatch has no ledger path task to run."
          fi

      - name: Commit and push changes if any
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "StegVerse Bot"
          git config user.email "bot@stegverse.org"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "chore(autopatch): self-heal repository paths"
            git push
          else
            echo "No changes to commit."
          fi

name: hybrid-bridge-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governed-normalization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run governed transition normalization tests
        run: python -m pytest -q tests/test_governed_transition_normalization.py

  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r api/requirements.txt pytest pytest-asyncio
      - name: Compile application and repository test dependencies
        run: |
          python -m compileall api/app cge-light/cge scripts
      - name: Run API tests
        env:
          PYTHONPATH: ${{ github.workspace }}/api:${{ github.workspace }}/cge-light:${{ github.workspace }}
        run: python -m pytest -q api/tests

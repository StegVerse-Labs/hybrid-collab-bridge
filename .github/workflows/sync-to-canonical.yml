name: sync-to-canonical

# Consumer template (StegDB#25, docs/CANONICAL_BUNDLE_PIN_CONTRACT.md). On request only: no
# schedule (ORGANIZATION-ROLE-RUNTIME-REALITY-DEPLOYMENT-001) and no cross-repository
# repository_dispatch (contained in StegDB dispatch-sync-to-canonical.yml until TV/TVC
# target-scoped dispatch authority exists). The bundle identity comes from the committed pin
# stegverse.canonical.pin.json, never from releases/latest. StegDB is private, so the download
# is authenticated with the TV/TVC-issued read warrant; without it the run fails closed.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this sync is requested (recorded in the lock receipt)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      CANONICAL_REPO: "StegVerse-Labs/StegDB"
      PIN_FILE: "stegverse.canonical.pin.json"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Resolve pinned identity
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PIN_FILE" || { echo "::error::FAIL_CLOSED CANONICAL_PIN_ABSENT: commit $PIN_FILE (docs/CANONICAL_BUNDLE_PIN_CONTRACT.md in StegDB)"; exit 2; }
          TAG="$(jq -er .tag "$PIN_FILE")"
          SRC="$(jq -er .source_commit "$PIN_FILE")"
          SHA="$(jq -er .bundle_sha256 "$PIN_FILE")"
          [[ "$TAG" == "canonical-$SRC" ]] || { echo "::error::FAIL_CLOSED CANONICAL_PIN_NOT_IMMUTABLE: tag must be canonical-<source_commit>"; exit 2; }
          [[ "$SRC" =~ ^[0-9a-f]{40}$ && "$SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::FAIL_CLOSED CANONICAL_PIN_MALFORMED"; exit 2; }
          { echo "tag=$TAG"; echo "source_commit=$SRC"; echo "sha256=$SHA"; } >> "$GITHUB_OUTPUT"

      - name: Download pinned canonical bundle (authenticated) and verify against the pin
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CANONICAL_READ_WARRANT }}
          TAG: ${{ steps.pin.outputs.tag }}
          SRC: ${{ steps.pin.outputs.source_commit }}
          PINNED: ${{ steps.pin.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::FAIL_CLOSED CANONICAL_READ_WARRANT_ABSENT: StegDB is private; a TV/TVC-issued read warrant is required (StegDB#25, H1 credential path)"
            exit 2
          fi
          gh release download "$TAG" --repo "$CANONICAL_REPO" --pattern canonical-bundle.zip --dir /tmp --clobber
          ACTUAL="$(sha256sum /tmp/canonical-bundle.zip | awk '{print $1}')"
          [[ "$ACTUAL" == "$PINNED" ]] || { echo "::error::FAIL_CLOSED CANONICAL_DIGEST_MISMATCH: got $ACTUAL, pinned $PINNED"; exit 2; }
          echo "$PINNED  canonical-bundle.zip" > /tmp/canonical-bundle.sha256
          gh api "repos/$CANONICAL_REPO/contents/tools/repo_manifest.json?ref=$SRC" -H "Accept: application/vnd.github.raw" > /tmp/repo_manifest.json

      - name: Unpack canonical bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/canonical
          mkdir -p /tmp/canonical
          unzip -q /tmp/canonical-bundle.zip -d /tmp/canonical
          test -d /tmp/canonical/canonical || (echo "::error::Expected /canonical folder in bundle"; exit 2)

      - name: Determine profiles for this repo (from StegDB manifest)
        id: prof
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/repo_manifest.json

          python - <<'PY'
          import json, os
          from pathlib import Path

          repo = os.environ.get("GITHUB_REPOSITORY","").strip()
          man = json.loads(Path("/tmp/repo_manifest.json").read_text(encoding="utf-8"))

          default_profiles = man.get("default_profiles") or ["base"]
          profiles = None

          for r in (man.get("repos") or []):
              if (r.get("name") or "").strip().lower() == repo.lower():
                  profiles = r.get("profiles") or default_profiles
                  break

          if not profiles:
              profiles = default_profiles

          # sanitize
          profiles = [p.strip() for p in profiles if isinstance(p,str) and p.strip()]
          if not profiles:
              profiles = ["base"]

          Path("/tmp/profiles.txt").write_text("\n".join(profiles) + "\n", encoding="utf-8")
          print("Profiles:", profiles)
          PY

          echo "profiles=$(paste -sd, /tmp/profiles.txt)" >> "$GITHUB_OUTPUT"

      - name: Apply profiles from canonical into repo (no deletions)
        shell: bash
        run: |
          set -euo pipefail

          PROFILES="${{ steps.prof.outputs.profiles }}"
          echo "Applying profiles: $PROFILES"

          # Convert comma list to newline
          python - <<'PY'
          import os
          ps = os.environ["PROFILES"].split(",")
          ps = [p.strip() for p in ps if p.strip()]
          open("/tmp/profiles_apply.txt","w",encoding="utf-8").write("\n".join(ps)+"\n")
          PY
        env:
          PROFILES: ${{ steps.prof.outputs.profiles }}

      - name: Sync profile contents
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r profile; do
            profile="$(echo "$profile" | xargs)"
            [[ -z "$profile" ]] && continue

            src="/tmp/canonical/canonical/profiles/${profile}"
            if [[ ! -d "$src" ]]; then
              echo "::warning title=Missing profile in canonical::profiles/${profile} not found in bundle; skipping"
              continue
            fi

            echo "== Syncing profile: $profile =="
            rsync -a "$src/" "./"
          done < /tmp/profiles_apply.txt

      - name: Write canonical lock file + stamp workflow headers
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(awk '{print $1}' /tmp/canonical-bundle.sha256)"
          PROFILES="$(paste -sd, /tmp/profiles_apply.txt)"

          python - <<PY
          import json, time, os, re
          from pathlib import Path

          sha = os.environ["SHA"].strip()
          profiles = [p.strip() for p in os.environ["PROFILES"].split(",") if p.strip()]

          lock = {
            "canonical_source": "${CANONICAL_REPO}",
            "canonical_tag": os.environ["TAG"],
            "source_commit": os.environ["SRC"],
            "pin_file": "${PIN_FILE}",
            "requested_by": os.environ["REQUESTER"],
            "reason": os.environ["REASON"],
            "run_id": os.environ["RUN_ID"],
            "sha256": sha,
            "profiles": profiles,
            "synced_at_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
          }
          Path("stegverse.canonical.lock.json").write_text(json.dumps(lock, indent=2, sort_keys=True)+"\n", encoding="utf-8")

          wf_dir = Path(".github/workflows")
          if wf_dir.exists():
            for wf in sorted(list(wf_dir.glob("*.yml")) + list(wf_dir.glob("*.yaml"))):
              lines = wf.read_text(encoding="utf-8").splitlines(True)
              # find first "name:"
              name_i = None
              for i,l in enumerate(lines):
                if re.match(r"^\s*name:\s*.+\s*$", l):
                  name_i = i
                  break
              if name_i is None:
                continue

              desired = f"# stegverse: canonical_sha256={sha} source=${CANONICAL_REPO} path={wf.as_posix()}\n"
              # header line is immediately after name:
              insert_i = name_i + 1
              if insert_i < len(lines) and re.match(r"^\s*#\s*stegverse:\s*.+\s*$", lines[insert_i]):
                if lines[insert_i] != desired:
                  lines[insert_i] = desired
              else:
                lines.insert(insert_i, desired)

              wf.write_text("".join(lines), encoding="utf-8")

          print("Wrote stegverse.canonical.lock.json and stamped workflow headers.")
          PY
        env:
          SHA: ${{ steps.pin.outputs.sha256 }}
          TAG: ${{ steps.pin.outputs.tag }}
          SRC: ${{ steps.pin.outputs.source_commit }}
          REASON: ${{ inputs.reason }}
          REQUESTER: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          PROFILES: ${{ steps.prof.outputs.profiles }}

      - name: Create PR if changes exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Untracked files count as changes: stage first, then compare the index.
          git add -A
          if git diff --cached --quiet; then
            echo "No changes after sync. Done."
            exit 0
          fi

          BR="canonical-sync-$(date -u +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BR"
          git add -A
          git commit -m "chore: sync canonical profiles [skip ci]"
          git push -u origin "$BR"

          TITLE="chore: sync canonical profiles"
          BODY=$'Generated by sync-to-canonical.\n\n- source: '"${CANONICAL_REPO}"$'\n- lock: `stegverse.canonical.lock.json`\n\nMerge to apply canonical profile updates.'
          gh pr create --title "$TITLE" --body "$BODY" || {
            echo "::warning::PR may already exist or permissions blocked. Create it manually from branch $BR."
          }

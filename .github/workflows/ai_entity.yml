name: ai_entity

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  ai-entity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare bounded PR context
        shell: bash
        run: |
          set -euo pipefail
          : > context.diff
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --unified=3 "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | head -c 24000 > context.diff || true
          fi

      - name: Run deterministic advisory fallback
        run: |
          python scripts/deterministic_advisory_fallback.py \
            --label "ai_entity" \
            --context context.diff \
            --summary ai-entity-advisory.md \
            --receipt ai-entity-advisory.json

      - name: Publish job summary
        run: cat ai-entity-advisory.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-authorizing advisory receipt
        uses: actions/upload-artifact@v4
        with:
          name: ai-entity-deterministic-advisory-${{ github.run_id }}
          path: |
            ai-entity-advisory.md
            ai-entity-advisory.json
          if-no-files-found: error

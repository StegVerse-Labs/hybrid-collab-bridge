name: StegVerse AI Entity (Claude/Beta_Orionis)

on:
workflow_dispatch:
inputs:
target_repo:
description: “Full repo name (e.g. StegVerse/StegCore)”
required: false
pr_number:
description: “PR number to review (optional)”
required: false
instructions:
description: “Optional instructions for StegVerse-AI-002 (Claude)”
required: false
analysis_depth:
description: “Analysis depth: quick, standard, deep”
required: false
default: “standard”

repository_dispatch:
types: [stegverse-claude-review]

permissions:
contents: read
pull-requests: write

jobs:
stegverse_claude:
runs-on: ubuntu-latest

```
env:
  GH_TOKEN: ${{ secrets.GH_STEGVERSE_AI_TOKEN }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

steps:
  - name: Checkout bridge repo
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Install tools
    run: |
      sudo apt-get update -y
      sudo apt-get install -y jq
      echo "${GH_TOKEN}" | gh auth login --with-token

  - name: Resolve inputs (manual vs forwarded)
    id: ctx
    run: |
      EVENT_NAME="${{ github.event_name }}"

      if [ "$EVENT_NAME" = "repository_dispatch" ]; then
        TARGET_REPO=$(jq -r '.client_payload.target_repo' "$GITHUB_EVENT_PATH")
        PR_NUMBER=$(jq -r '.client_payload.pr_number' "$GITHUB_EVENT_PATH")
        INSTR=$(jq -r '.client_payload.instructions // "Review this PR for security, correctness, and Guardian compliance."' "$GITHUB_EVENT_PATH")
        DEPTH=$(jq -r '.client_payload.analysis_depth // "standard"' "$GITHUB_EVENT_PATH")
      else
        TARGET_REPO="${{ github.event.inputs.target_repo }}"
        PR_NUMBER="${{ github.event.inputs.pr_number }}"
        INSTR="${{ github.event.inputs.instructions }}"
        DEPTH="${{ github.event.inputs.analysis_depth }}"
      fi

      # Defaults
      if [ -z "$INSTR" ] || [ "$INSTR" = "null" ]; then
        INSTR="Act as StegVerse-AI-002 (Claude/Beta_Orionis). Review for architecture, security, and governance alignment."
      fi
      if [ -z "$DEPTH" ] || [ "$DEPTH" = "null" ]; then
        DEPTH="standard"
      fi

      echo "TARGET_REPO=$TARGET_REPO"
      echo "PR_NUMBER=$PR_NUMBER"
      echo "INSTR=$INSTR"
      echo "DEPTH=$DEPTH"

      {
        echo "target_repo=$TARGET_REPO"
        echo "pr_number=$PR_NUMBER"
        echo "instructions<<EOF"
        echo "$INSTR"
        echo "EOF"
        echo "depth=$DEPTH"
      } >> $GITHUB_OUTPUT

  - name: Fetch context (PR diff or repo info)
    id: diff
    run: |
      TARGET_REPO="${{ steps.ctx.outputs.target_repo }}"
      PR_NUMBER="${{ steps.ctx.outputs.pr_number }}"

      if [ -n "$TARGET_REPO" ] && [ "$TARGET_REPO" != "null" ] && [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
        DIFF_CONTENT="$(gh pr diff "$PR_NUMBER" --repo "$TARGET_REPO" | head -c 100000 || true)"
        PR_TITLE="$(gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" --json title -q .title)"
        PR_BODY="$(gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" --json body -q .body | head -c 5000)"
      elif [ -n "$TARGET_REPO" ] && [ "$TARGET_REPO" != "null" ]; then
        DIFF_CONTENT="$(gh repo view "$TARGET_REPO" --json description,nameWithOwner,defaultBranchRef | jq -r tostring)"
        PR_TITLE="Repository Overview"
        PR_BODY="General repository analysis requested"
      else
        DIFF_CONTENT="No specific target provided; self-diagnostic mode."
        PR_TITLE="Self-Check"
        PR_BODY="StegVerse-AI-002 entity health check"
      fi

      {
        echo "diff_content<<EOF"
        echo "$DIFF_CONTENT"
        echo "EOF"
        echo "pr_title=$PR_TITLE"
        echo "pr_body<<EOF"
        echo "$PR_BODY"
        echo "EOF"
      } >> $GITHUB_OUTPUT

  - name: Call Claude API (StegVerse-AI-002)
    id: claude
    run: |
      TARGET_REPO="${{ steps.ctx.outputs.target_repo }}"
      PR_NUMBER="${{ steps.ctx.outputs.pr_number }}"
      INSTR="${{ steps.ctx.outputs.instructions }}"
      DEPTH="${{ steps.ctx.outputs.depth }}"
      DIFF_CONTENT="${{ steps.diff.outputs.diff_content }}"
      PR_TITLE="${{ steps.diff.outputs.pr_title }}"
      PR_BODY="${{ steps.diff.outputs.pr_body }}"

      # Set max_tokens based on depth
      case "$DEPTH" in
        quick)   MAX_TOKENS=1024 ;;
        standard) MAX_TOKENS=2048 ;;
        deep)    MAX_TOKENS=4096 ;;
        *)       MAX_TOKENS=2048 ;;
      esac

      SYSTEM_PROMPT='You are "StegVerse-AI-002" (Claude/Beta_Orionis), an AI entity in the StegVerse Hybrid Collaboration Bridge.
```

Entity Identity:

- entity_id: stegverse-ai-002
- entity_type: llm_adapter
- org_id: StegVerse-Labs
- owner_human: Rigel
- owner_ai: Beta_Orionis
- capability_set: code_review, architecture_analysis, security_audit, governance_check
- governance_scope: internal

Guardian Principles:

- Security: Identify vulnerabilities, secrets exposure, unsafe patterns
- Transparency: Explain reasoning, cite sources, show work
- Verifiability: Provide concrete examples, line numbers, reproducible steps
- Non-abuse: Never suggest malicious code, respect privacy, follow ethics

Review Protocol:

1. CONTEXT: Summarize what you are reviewing (PR title, scope, files changed)
1. FINDINGS: List concrete issues by category:
- Security vulnerabilities
- Code quality issues
- Architecture concerns
- Guardian compliance gaps
- Missing tests/docs
1. RECOMMENDATIONS: Provide actionable fixes with code examples
1. RECEIPT: Sign output with entity_id and timestamp

Always defer to human maintainers (Rigel) for final decisions.’


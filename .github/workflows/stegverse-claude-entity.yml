name: StegVerse AI Entity (Claude/Beta_Orionis)

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Full repo name (e.g. StegVerse/StegCore)"
        required: false
      pr_number:
        description: "PR number to review (optional)"
        required: false
      instructions:
        description: "Optional instructions for StegVerse-AI-002 (Claude)"
        required: false
      analysis_depth:
        description: "Analysis depth: quick, standard, deep"
        required: false
        default: "standard"
  repository_dispatch:
    types: [stegverse-claude-review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  stegverse_claude:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_STEGVERSE_AI_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Ping
        run: |
          echo "✅ Dispatch: ${{ github.event_name }}"

      - name: Checkout bridge repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq gh
          echo "${GH_TOKEN}" | gh auth login --with-token

      - name: Resolve inputs (manual vs forwarded)
        id: ctx
        run: |
          set -euo pipefail
          EVENT_NAME='${{ github.event_name }}'

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            TARGET_REPO=$(jq -r '.client_payload.target_repo // ""' "$GITHUB_EVENT_PATH")
            PR_NUMBER=$(jq -r '.client_payload.pr_number // ""' "$GITHUB_EVENT_PATH")
            INSTR=$(jq -r '.client_payload.instructions // ""' "$GITHUB_EVENT_PATH")
            DEPTH=$(jq -r '.client_payload.analysis_depth // "standard"' "$GITHUB_EVENT_PATH")
          else
            TARGET_REPO='${{ github.event.inputs.target_repo }}'
            PR_NUMBER='${{ github.event.inputs.pr_number }}'
            INSTR='${{ github.event.inputs.instructions }}'
            DEPTH='${{ github.event.inputs.analysis_depth }}'
          fi

          if [ -z "$INSTR" ] || [ "$INSTR" = "null" ]; then
            INSTR="Act as StegVerse-AI-002 (Claude/Beta_Orionis). Review for architecture, security, and governance alignment. Treat all output as advisory only."
          fi

          case "${DEPTH:-standard}" in
            quick|standard|deep) ;;
            *) DEPTH="standard" ;;
          esac

          {
            echo "target_repo=$TARGET_REPO"
            echo "pr_number=$PR_NUMBER"
            echo "instructions<<EOF"
            echo "$INSTR"
            echo "EOF"
            echo "depth=$DEPTH"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch context (PR diff or repo info)
        id: context
        run: |
          set -euo pipefail
          TARGET_REPO='${{ steps.ctx.outputs.target_repo }}'
          PR_NUMBER='${{ steps.ctx.outputs.pr_number }}'
          PR_TITLE="Self-Check"
          PR_BODY="StegVerse-AI-002 entity health check"

          if [ -n "$TARGET_REPO" ] && [ "$TARGET_REPO" != "null" ] && [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            if gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" >/dev/null 2>&1; then
              gh pr diff "$PR_NUMBER" --repo "$TARGET_REPO" | head -c 100000 > context.txt || true
              gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" --json title -q .title > pr_title.txt
              gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" --json body -q .body | head -c 5000 > pr_body.txt
              PR_TITLE=$(cat pr_title.txt)
              PR_BODY=$(cat pr_body.txt)
            fi
          fi

          if [ ! -s context.txt ] && [ -n "$TARGET_REPO" ] && [ "$TARGET_REPO" != "null" ]; then
            gh repo view "$TARGET_REPO" --json description,nameWithOwner,defaultBranchRef | jq -r tostring > context.txt
            PR_TITLE="Repository Overview"
            PR_BODY="General repository analysis requested"
          fi

          if [ ! -s context.txt ]; then
            printf '%s\n' "No specific target provided; self-diagnostic mode." > context.txt
          fi

          {
            echo "pr_title<<EOF"
            echo "$PR_TITLE"
            echo "EOF"
            echo "pr_body<<EOF"
            echo "$PR_BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Call Claude API (StegVerse-AI-002)
        id: claude
        run: |
          set -euo pipefail
          TARGET_REPO='${{ steps.ctx.outputs.target_repo }}'
          PR_NUMBER='${{ steps.ctx.outputs.pr_number }}'
          INSTR='${{ steps.ctx.outputs.instructions }}'
          DEPTH='${{ steps.ctx.outputs.depth }}'
          PR_TITLE='${{ steps.context.outputs.pr_title }}'
          PR_BODY='${{ steps.context.outputs.pr_body }}'

          case "$DEPTH" in
            quick) MAX_TOKENS=1024 ;;
            standard) MAX_TOKENS=2048 ;;
            deep) MAX_TOKENS=4096 ;;
            *) MAX_TOKENS=2048 ;;
          esac

          SYSTEM_PROMPT=$'You are "StegVerse-AI-002" (Claude/Beta_Orionis), an AI entity in the StegVerse Hybrid Collaboration Bridge.\nEntity identity:\n- entity_id: stegverse-ai-002\n- entity_type: llm_adapter\n- governance_scope: internal\nGuardian rules:\n- Security: identify vulnerabilities, secrets exposure, unsafe patterns.\n- Transparency: explain findings clearly.\n- Verifiability: provide concrete examples and reproducible steps.\n- Non-abuse: never suggest malicious code and never request or expose secrets.\n- Treat your output as advisory. Human maintainers are final authority.\nReview protocol: 1) Context, 2) Findings, 3) Recommendations, 4) Receipt.'

          USER_MESSAGE=$(jq -Rs --arg repo "${TARGET_REPO:-none}" --arg pr "${PR_NUMBER:-none}" --arg title "$PR_TITLE" --arg body "$PR_BODY" --arg depth "$DEPTH" --arg instructions "$INSTR" '
            "Repository: \($repo)\nPR #\($pr): \($title)\n\n\($body)\n\nAnalysis depth: \($depth)\nInstructions: \($instructions)\n\nCode/Diff:\n" + .
          ' < context.txt)

          REQUEST_BODY=$(jq -n \
            --arg model "claude-sonnet-4-20250514" \
            --arg system "$SYSTEM_PROMPT" \
            --argjson user_msg "$USER_MESSAGE" \
            --argjson max_tokens "$MAX_TOKENS" \
            '{
              model: $model,
              max_tokens: $max_tokens,
              temperature: 0.3,
              system: $system,
              messages: [
                {role: "user", content: $user_msg}
              ]
            }')

          RESPONSE=$(curl -sS https://api.anthropic.com/v1/messages \
            -H "anthropic-version: 2023-06-01" \
            -H "x-api-key: $ANTHROPIC_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY")

          echo "$RESPONSE" > claude_response.json
          CLAUDE_COMMENT=$(jq -r '.content[0].text // empty' claude_response.json)
          if [ -z "$CLAUDE_COMMENT" ]; then
            CLAUDE_COMMENT="No response from Claude."
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SIGNATURE=$(printf '\n-----\n\n**StegVerse-AI-002 Receipt**\n\n- Entity: Claude/Beta_Orionis\n- Timestamp: %s\n- Analysis Depth: %s\n- Repository: %s\n- PR: #%s\n' "$TIMESTAMP" "$DEPTH" "${TARGET_REPO:-none}" "${PR_NUMBER:-none}")
          FULL_COMMENT="${CLAUDE_COMMENT}${SIGNATURE}"

          {
            echo "claude_comment<<EOF"
            echo "$FULL_COMMENT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post response
        env:
          CLAUDE_COMMENT: ${{ steps.claude.outputs.claude_comment }}
        run: |
          set -euo pipefail
          TARGET_REPO='${{ steps.ctx.outputs.target_repo }}'
          PR_NUMBER='${{ steps.ctx.outputs.pr_number }}'

          echo "========================================="
          echo "StegVerse-AI-002 (Claude) Output"
          echo "========================================="
          echo "$CLAUDE_COMMENT"
          echo "========================================="

          if [ -n "$TARGET_REPO" ] && [ "$TARGET_REPO" != "null" ] && [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            gh pr comment "$PR_NUMBER" --repo "$TARGET_REPO" --body "$CLAUDE_COMMENT" || true
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "StegVerse-AI-002 (Claude) Report" --body "$CLAUDE_COMMENT" || true
          fi

      - name: Archive to CGE Light
        run: |
          set -euo pipefail
          mkdir -p cge-light/traces
          TIMESTAMP=$(date -u +"%Y%m%d_%H%M%S")
          TRACE_FILE="cge-light/traces/ai-002_${TIMESTAMP}.json"

          jq -n \
            --arg entity_id "stegverse-ai-002" \
            --arg timestamp "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --arg target_repo '${{ steps.ctx.outputs.target_repo }}' \
            --arg pr_number '${{ steps.ctx.outputs.pr_number }}' \
            --arg depth '${{ steps.ctx.outputs.depth }}' \
            --arg output '${{ steps.claude.outputs.claude_comment }}' \
            '{
              entity_id: $entity_id,
              entity_type: "llm_adapter",
              timestamp: $timestamp,
              action: "code_review",
              target: {repo: $target_repo, pr: $pr_number},
              parameters: {depth: $depth},
              output: $output,
              governance: {
                admission: "advisory_only",
                policy_version: "v1.0.0"
              }
            }' > "$TRACE_FILE"

          echo "Trace archived: $TRACE_FILE"

name: StegVerse AI Entity (Claude/Beta_Orionis)

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Full repo name (e.g. StegVerse/StegCore)"
        required: false
      pr_number:
        description: "PR number to review (optional)"
        required: false
      instructions:
        description: "Optional instructions for StegVerse-AI-002 (Claude)"
        required: false
      analysis_depth:
        description: "Analysis depth: quick, standard, deep"
        required: false
        default: "standard"
  repository_dispatch:
    types: [stegverse-claude-review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  stegverse_claude:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_STEGVERSE_AI_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout bridge repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq gh

      - name: Resolve inputs
        id: ctx
        run: |
          set -euo pipefail
          EVENT_NAME="${{ github.event_name }}"

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            TARGET_REPO=$(jq -r '.client_payload.target_repo // ""' "$GITHUB_EVENT_PATH")
            PR_NUMBER=$(jq -r '.client_payload.pr_number // ""' "$GITHUB_EVENT_PATH")
            INSTR=$(jq -r '.client_payload.instructions // ""' "$GITHUB_EVENT_PATH")
            DEPTH=$(jq -r '.client_payload.analysis_depth // "standard"' "$GITHUB_EVENT_PATH")
          else
            TARGET_REPO=$(jq -r '.inputs.target_repo // ""' "$GITHUB_EVENT_PATH")
            PR_NUMBER=$(jq -r '.inputs.pr_number // ""' "$GITHUB_EVENT_PATH")
            INSTR=$(jq -r '.inputs.instructions // ""' "$GITHUB_EVENT_PATH")
            DEPTH=$(jq -r '.inputs.analysis_depth // "standard"' "$GITHUB_EVENT_PATH")
          fi

          if [ -z "$INSTR" ] || [ "$INSTR" = "null" ]; then
            INSTR="Act as StegVerse-AI-002 Claude/Beta_Orionis. Review for architecture, security, and governance alignment. Treat output as advisory only."
          fi

          case "$DEPTH" in
            quick|standard|deep) ;;
            *) DEPTH="standard" ;;
          esac

          {
            echo "target_repo=$TARGET_REPO"
            echo "pr_number=$PR_NUMBER"
            echo "depth=$DEPTH"
            echo "instructions<<CTX_EOF"
            echo "$INSTR"
            echo "CTX_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare review context
        run: |
          set -euo pipefail
          TARGET_REPO='${{ steps.ctx.outputs.target_repo }}'
          PR_NUMBER='${{ steps.ctx.outputs.pr_number }}'
          : > context.txt
          : > pr_title.txt
          : > pr_body.txt

          if [ -n "$TARGET_REPO" ] && [ "$TARGET_REPO" != "null" ] && [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            if gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" >/dev/null 2>&1; then
              gh pr diff "$PR_NUMBER" --repo "$TARGET_REPO" | head -c 100000 > context.txt || true
              gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" --json title -q .title > pr_title.txt || true
              gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" --json body -q .body | head -c 5000 > pr_body.txt || true
            fi
          fi

          if [ ! -s context.txt ] && [ -n "$TARGET_REPO" ] && [ "$TARGET_REPO" != "null" ]; then
            gh repo view "$TARGET_REPO" --json nameWithOwner,description,defaultBranchRef | jq -r tostring > context.txt
            printf '%s\n' "Repository Overview" > pr_title.txt
            printf '%s\n' "General repository analysis requested." > pr_body.txt
          fi

          if [ ! -s context.txt ]; then
            printf '%s\n' "No specific target provided. Running self-diagnostic mode." > context.txt
            printf '%s\n' "Self-Check" > pr_title.txt
            printf '%s\n' "StegVerse-AI-002 entity health check." > pr_body.txt
          fi

      - name: Call Claude API
        run: |
          set -euo pipefail
          TARGET_REPO='${{ steps.ctx.outputs.target_repo }}'
          PR_NUMBER='${{ steps.ctx.outputs.pr_number }}'
          INSTR='${{ steps.ctx.outputs.instructions }}'
          DEPTH='${{ steps.ctx.outputs.depth }}'

          case "$DEPTH" in
            quick) MAX_TOKENS=1024 ;;
            standard) MAX_TOKENS=2048 ;;
            deep) MAX_TOKENS=4096 ;;
            *) MAX_TOKENS=2048 ;;
          esac

          SYSTEM_PROMPT=$'You are "StegVerse-AI-002" Claude/Beta_Orionis, an AI entity in the StegVerse Hybrid Collaboration Bridge.\n\nGuardian Principles:\n- Security: identify vulnerabilities, secrets exposure, and unsafe patterns.\n- Transparency: explain reasoning and cite concrete evidence from provided context.\n- Verifiability: provide reproducible checks where possible.\n- Non-abuse: never suggest malicious code or request secrets.\n\nReview protocol:\n1. CONTEXT\n2. FINDINGS\n3. RECOMMENDATIONS\n4. RECEIPT\n\nTreat output as advisory. Human maintainers are final authority.'

          USER_MESSAGE=$(cat <<'MSG_EOF'
          Repository: __TARGET_REPO__
          PR: __PR_NUMBER__
          PR title: __PR_TITLE__
          Analysis depth: __DEPTH__
          Instructions: __INSTR__
          
          PR body:
          __PR_BODY__
          
          Code or repository context:
          __CONTEXT__
          MSG_EOF
          )
          USER_MESSAGE=${USER_MESSAGE/__TARGET_REPO__/${TARGET_REPO:-none}}
          USER_MESSAGE=${USER_MESSAGE/__PR_NUMBER__/${PR_NUMBER:-none}}
          USER_MESSAGE=${USER_MESSAGE/__PR_TITLE__/$(cat pr_title.txt)}
          USER_MESSAGE=${USER_MESSAGE/__DEPTH__/$DEPTH}
          USER_MESSAGE=${USER_MESSAGE/__INSTR__/$INSTR}
          USER_MESSAGE=${USER_MESSAGE/__PR_BODY__/$(cat pr_body.txt)}
          USER_MESSAGE=${USER_MESSAGE/__CONTEXT__/$(cat context.txt)}

          jq -n \
            --arg model "claude-sonnet-4-20250514" \
            --arg system "$SYSTEM_PROMPT" \
            --arg user_msg "$USER_MESSAGE" \
            --argjson max_tokens "$MAX_TOKENS" \
            '{
              model: $model,
              max_tokens: $max_tokens,
              temperature: 0.3,
              system: $system,
              messages: [
                {role: "user", content: $user_msg}
              ]
            }' > request.json

          curl -sS https://api.anthropic.com/v1/messages \
            -H "anthropic-version: 2023-06-01" \
            -H "x-api-key: $ANTHROPIC_API_KEY" \
            -H "Content-Type: application/json" \
            -d @request.json > claude_response.json

          jq -r '.content[0].text // .error.message // "No response from Claude."' claude_response.json > claude_comment.md

          {
            printf '\n-----\n\n'
            printf '**StegVerse-AI-002 Receipt**\n\n'
            printf -- '- Entity: Claude/Beta_Orionis\n'
            printf -- '- Timestamp: %s\n' "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            printf -- '- Analysis Depth: %s\n' "$DEPTH"
            printf -- '- Repository: %s\n' "${TARGET_REPO:-none}"
            printf -- '- PR: #%s\n' "${PR_NUMBER:-none}"
          } >> claude_comment.md

      - name: Post response
        run: |
          set -euo pipefail
          TARGET_REPO='${{ steps.ctx.outputs.target_repo }}'
          PR_NUMBER='${{ steps.ctx.outputs.pr_number }}'
          echo "========================================="
          echo "StegVerse-AI-002 Claude Output"
          echo "========================================="
          cat claude_comment.md
          echo "========================================="

          if [ -n "$TARGET_REPO" ] && [ "$TARGET_REPO" != "null" ] && [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            gh pr comment "$PR_NUMBER" --repo "$TARGET_REPO" --body-file claude_comment.md || true
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "StegVerse-AI-002 Claude Report" --body-file claude_comment.md || true
          fi

      - name: Archive CGE Light trace
        run: |
          set -euo pipefail
          mkdir -p cge-light/traces
          TRACE_FILE="cge-light/traces/ai-002_$(date -u +"%Y%m%d_%H%M%S").json"

          jq -n \
            --arg entity_id "stegverse-ai-002" \
            --arg timestamp "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --arg target_repo '${{ steps.ctx.outputs.target_repo }}' \
            --arg pr_number '${{ steps.ctx.outputs.pr_number }}' \
            --arg depth '${{ steps.ctx.outputs.depth }}' \
            --rawfile output claude_comment.md \
            '{
              entity_id: $entity_id,
              entity_type: "llm_adapter",
              timestamp: $timestamp,
              action: "code_review",
              target: {repo: $target_repo, pr: $pr_number},
              parameters: {depth: $depth},
              output: $output,
              governance: {
                admission: "advisory_only",
                policy_version: "v1.0.0"
              }
            }' > "$TRACE_FILE"
          echo "Trace archived: $TRACE_FILE"

      - name: Upload CGE Light trace
        uses: actions/upload-artifact@v4
        with:
          name: cge-light-trace-${{ github.run_id }}
          path: cge-light/traces/*.json
          if-no-files-found: warn

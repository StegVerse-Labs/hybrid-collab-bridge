name: StegVerse AI Entity (Bridge)

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Full repo name (e.g. StegVerse/StegCore)"
        required: false
      pr_number:
        description: "PR number (optional)"
        required: false
      instructions:
        description: "Optional instructions"
        required: false
  repository_dispatch:
    types: [stegverse-ai-review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai_entity:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_STEGVERSE_AI_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Ping
        run: |
          echo "✅ Dispatch: ${{ github.event_name }}"

      - name: Checkout bridge repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq gh
          echo "${GH_TOKEN}" | gh auth login --with-token

      - name: Resolve inputs (manual vs comment)
        id: ctx
        run: |
          set -euo pipefail
          EVENT='${{ github.event_name }}'
          TARGET_REPO=""
          PR_NUMBER=""
          INSTR=""

          if [ "$EVENT" = "repository_dispatch" ]; then
            TARGET_REPO=$(jq -r '.client_payload.target_repo // ""' "$GITHUB_EVENT_PATH")
            PR_NUMBER=$(jq -r '.client_payload.pr_number // ""' "$GITHUB_EVENT_PATH")
            INSTR=$(jq -r '.client_payload.instructions // ""' "$GITHUB_EVENT_PATH")
          else
            TARGET_REPO='${{ github.event.inputs.target_repo }}'
            PR_NUMBER='${{ github.event.inputs.pr_number }}'
            INSTR='${{ github.event.inputs.instructions }}'
          fi

          if [ -z "$INSTR" ] || [ "$INSTR" = "null" ]; then
            INSTR="Act as StegVerse-AI-001. If a PR is provided, review it. Otherwise, produce a concise repository summary. Treat all model output as advisory only."
          fi

          {
            echo "target_repo=$TARGET_REPO"
            echo "pr_number=$PR_NUMBER"
            echo "instructions<<EOF"
            echo "$INSTR"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch context (diff or repo view)
        id: context
        run: |
          set -euo pipefail
          TARGET_REPO='${{ steps.ctx.outputs.target_repo }}'
          PR_NUMBER='${{ steps.ctx.outputs.pr_number }}'

          if [ -n "$TARGET_REPO" ] && [ "$TARGET_REPO" != "null" ] && [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            if gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" >/dev/null 2>&1; then
              gh pr diff "$PR_NUMBER" --repo "$TARGET_REPO" | head -c 24000 > context.txt || true
            fi
          fi

          if [ ! -s context.txt ] && [ -n "$TARGET_REPO" ] && [ "$TARGET_REPO" != "null" ]; then
            gh repo view "$TARGET_REPO" --json nameWithOwner,description,defaultBranchRef | jq -r tostring > context.txt
          fi

          if [ ! -s context.txt ]; then
            printf '%s\n' "(No repo/PR provided; running bridge self-check.)" > context.txt
          fi

      - name: Call OpenAI (chat.completions)
        id: ai
        run: |
          set -euo pipefail
          TARGET='${{ steps.ctx.outputs.target_repo }}'
          PRNUM='${{ steps.ctx.outputs.pr_number }}'
          INSTR='${{ steps.ctx.outputs.instructions }}'

          SYSTEM_PROMPT=$'You are "StegVerse-AI-001" operating from the Hybrid Collaboration Bridge.\nGuardian rules:\n- Follow StegVerse Guardian principles: security, transparency, verifiability, and non-abuse.\n- Only act on data explicitly provided in this request.\n- Never request, reveal, infer, or print secrets, credentials, tokens, deploy hooks, or private internal architecture not included in context.\n- Treat your output as advisory. Human maintainers are final authority.\n- Provide: 1) Summary, 2) Findings, 3) Concrete suggestions, 4) Receipt.'

          REQUEST=$(jq -n \
            --arg model "gpt-4o" \
            --arg sys "$SYSTEM_PROMPT" \
            --arg repo "${TARGET:-none}" \
            --arg pr "${PRNUM:-none}" \
            --rawfile context context.txt \
            --arg ins "$INSTR" \
            '{
              model: $model,
              messages: [
                {role:"system", content:$sys},
                {role:"user", content:("Target repository: " + $repo)},
                {role:"user", content:("PR number: " + $pr)},
                {role:"user", content:"Context (diff or repo info):"},
                {role:"user", content:$context},
                {role:"user", content:("Instructions: " + $ins)}
              ],
              max_tokens: 900,
              temperature: 0.2
            }')

          RESPONSE=$(curl -sS https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$REQUEST")

          echo "$RESPONSE" > response.json
          AI_TEXT=$(jq -r '.choices[0].message.content // empty' response.json)
          if [ -z "$AI_TEXT" ]; then
            AI_TEXT="(No response from model.)"
          fi

          {
            echo "ai_comment<<EOF"
            echo "$AI_TEXT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post result (PR comment / issue reply / bridge issue)
        env:
          AI_TEXT: ${{ steps.ai.outputs.ai_comment }}
        run: |
          set -euo pipefail
          echo "----- AI OUTPUT -----"
          echo "$AI_TEXT"
          echo "---------------------"

          TARGET_REPO='${{ steps.ctx.outputs.target_repo }}'
          PR_NUMBER='${{ steps.ctx.outputs.pr_number }}'

          if [ -n "$TARGET_REPO" ] && [ "$TARGET_REPO" != "null" ] && [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            gh pr comment "$PR_NUMBER" --repo "$TARGET_REPO" --body "$AI_TEXT" || true
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "StegVerse-AI-001 report" --body "$AI_TEXT" || true
          fi

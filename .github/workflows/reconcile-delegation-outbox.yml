name: reconcile-delegation-outbox

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
  push:
    paths:
      - sessions/**/03_referee.json
      - scripts/reconcile_delegation_outbox.py
      - api/app/governance/delegation_candidate.py
      - api/tests/test_delegation_candidate.py
      - api/tests/test_delegation_outbox.py
      - .github/workflows/reconcile-delegation-outbox.yml

permissions:
  contents: write

concurrency:
  group: reconcile-delegation-outbox
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r api/requirements.txt
      - name: Validate candidate and outbox contracts
        run: |
          python -m py_compile scripts/reconcile_delegation_outbox.py
          cd api
          python -m pytest -q tests/test_delegation_candidate.py tests/test_delegation_outbox.py
      - name: Reconcile governed session traces into outbox
        run: python scripts/reconcile_delegation_outbox.py
      - name: Commit outbox and queue state
        run: |
          if git diff --quiet -- outbox/ecosystem-delegation state/delegation_outbox_reconciliation.json; then
            echo "Delegation outbox already reconciled."
            exit 0
          fi
          git config user.name "StegVerse Bot"
          git config user.email "stegverse-bot@users.noreply.github.com"
          git add outbox/ecosystem-delegation state/delegation_outbox_reconciliation.json
          git commit -m "Reconcile governed delegation outbox"
          git pull --rebase origin main
          git push origin HEAD:main
